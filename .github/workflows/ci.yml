name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  promo-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and fonts (same as the job workflow)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Khmer voice-over (same as the job workflow)
        run: python3 -m pip install --user edge-tts==7.3.1
      - run: node scripts/test_promo_render.mjs
      - run: node scripts/test_poster_render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promo-render-check
          path: output/
          retention-days: 3
